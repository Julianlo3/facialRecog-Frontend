<div class="dashboard-page">
  <!-- Top Title / Status Bar -->
  <header class="dashboard-header">
    <div class="header-left">
      <span class="tech-tag">PANEL DE CONTROL</span>
      <h1 class="page-title">Monitor de Accesos</h1>
    </div>
    <div class="header-right">
      <div class="system-status-indicator">
        <span class="pulse-dot"></span>
        <span class="status-text">SISTEMA ACTIVO — <app-clock-time></app-clock-time></span>
      </div>
    </div>
  </header>

  <!-- Top Stat Cards Grid -->
  <section class="stats-grid">
    <!-- Card 1: Total Hoy -->
    <div class="stat-card cyan">
      <div class="card-inner">
        <div class="card-left">
          <span class="card-label">TOTAL HOY</span>
          <span class="card-value">10</span>
        </div>
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
        </div>
      </div>
      <div class="card-glow"></div>
    </div>

    <!-- Card 2: Autorizados -->
    <div class="stat-card green">
      <div class="card-inner">
        <div class="card-left">
          <span class="card-label">AUTORIZADOS</span>
          <span class="card-value">6</span>
        </div>
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
        </div>
      </div>
      <div class="card-glow"></div>
    </div>

    <!-- Card 3: Denegados -->
    <div class="stat-card red">
      <div class="card-inner">
        <div class="card-left">
          <span class="card-label">DENEGADOS</span>
          <span class="card-value">3</span>
        </div>
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="9" x2="15" y2="15"></line>
            <line x1="15" y1="9" x2="9" y2="15"></line>
          </svg>
        </div>
      </div>
      <div class="card-glow"></div>
    </div>

    <!-- Card 4: Tasa Reconocimiento -->
    <div class="stat-card orange">
      <div class="card-inner">
        <div class="card-left">
          <span class="card-label">TASA RECONOCIMIENTO</span>
          <span class="card-value">60%</span>
        </div>
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
            <polyline points="17 6 23 6 23 12"></polyline>
          </svg>
        </div>
      </div>
      <div class="card-glow"></div>
    </div>
  </section>

  <!-- Middle Section: Live Camera stream -->
  <section class="camera-section">
    <div class="section-header">
      <span class="tech-tag">MONITOR EN VIVO</span>
      <h2 class="section-title">Cámara de Acceso</h2>
    </div>
    <app-camera></app-camera>
  </section>

  <app-control-mqtt></app-control-mqtt>

  <app-events></app-events>

  <!-- Bottom Section: Logs Table -->
  <section class="logs-section">
    <div class="logs-header-container">
      <div class="logs-title-left">
        <span class="tech-tag">REGISTRO</span>
        <h2 class="section-title">Historial de Accesos</h2>
      </div>

      
      
      <div class="logs-controls">
        <!-- Search -->
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" placeholder="Buscar..." class="search-input">
        </div>

        <!-- Filter Buttons -->
        <div class="filter-group">
          <button class="filter-btn active">TODOS</button>
          <button class="filter-btn">AUTH</button>
          <button class="filter-btn">DENEGADO</button>
          <button class="filter-btn">DESCONOCIDO</button>
        </div>
      </div>
    </div>

    <!-- Logs Table -->
    <div class="table-container">
      <table class="logs-table">
        <thead>
          <tr>
            <th>PERSONA</th>
            <th>ESTADO</th>
            <th>CONFIANZA</th>
            <th>UBICACIÓN</th>
            <th>HORA</th>
          </tr>
        </thead>
        <tbody>

          <tr>
      
        </tbody>
      </table>
    </div>
  </section>
</div>
