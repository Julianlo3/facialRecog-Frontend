<div class="camera-container">
  <!-- Top HUD Bar -->
  <div class="camera-hud-top">
    <div class="hud-left">
      <span class="rec-dot"></span>
      <span class="hud-title">CAM_01 // ENTRADA_PRINCIPAL</span>
    </div>
    <div class="hud-right">
      <span class="hud-badge">LIVE</span>
      <span class="hud-meta">1080P // 30 FPS</span>
    </div>
  </div>

  <!-- Main Viewport -->
  <div class="camera-viewport">
    <!-- CCTV Grid and Scanline Overlay -->
    <div class="cctv-grid"></div>
    <div class="cctv-scanline"></div>
    <div class="cctv-noise"></div>
    
    <!-- Target Corner Bracket Marks -->
    <div class="bracket top-left"></div>
    <div class="bracket top-right"></div>
    <div class="bracket bottom-left"></div>
    <div class="bracket bottom-right"></div>
    <img src="http://192.168.1.66:8000/video">
</div>
