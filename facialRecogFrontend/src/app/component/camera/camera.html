<div class="camera-container">
  <!-- Top HUD Bar -->
  <div class="camera-hud-top">
    <div class="hud-left">
      <span class="rec-dot"></span>
      <span class="hud-title">CAM_01 // ENTRADA_PRINCIPAL</span>
    </div>
    <div class="hud-right">
      <span class="hud-badge">LIVE</span>
      <span class="hud-meta">1080P // 30 FPS</span>
    </div>
  </div>

  <!-- Main Viewport -->
  <div class="camera-viewport">
    <!-- CCTV Grid and Scanline Overlay -->
    <div class="cctv-grid"></div>
    <div class="cctv-scanline"></div>
    <div class="cctv-noise"></div>
    
    <!-- Target Corner Bracket Marks -->
    <div class="bracket top-left"></div>
    <div class="bracket top-right"></div>
    <div class="bracket bottom-left"></div>
    <div class="bracket bottom-right"></div>

    <!-- Detected Face 1: Authorized (Green) -->
    <div class="face-target authorized" style="top: 25%; left: 35%; width: 140px; height: 160px;">
      <div class="target-box">
        <span class="t-line tl"></span>
        <span class="t-line tr"></span>
        <span class="t-line bl"></span>
        <span class="t-line br"></span>
      </div>
      <div class="target-info">
        <span class="target-status">AUTORIZADO</span>
        <span class="target-name">V. Reyes [98.4%]</span>
      </div>
    </div>

    <!-- Detected Face 2: Unidentified (Red) -->
    <div class="face-target unauthorized" style="top: 45%; left: 65%; width: 120px; height: 140px;">
      <div class="target-box">
        <span class="t-line tl"></span>
        <span class="t-line tr"></span>
        <span class="t-line bl"></span>
        <span class="t-line br"></span>
      </div>
      <div class="target-info">
        <span class="target-status">DESCONOCIDO</span>
        <span class="target-name">ANALIZANDO...</span>
      </div>
    </div>

    <!-- Simulated camera overlay details -->
    <div class="viewport-overlay-footer">
      <span class="overlay-time">ISO 400 // F2.8</span>
      <span class="overlay-date">CAM_ACTIVE</span>
    </div>
  </div>
</div>
